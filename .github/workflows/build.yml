name: Build Keyboard Firmware

on:
  push:
    branches:
      - "**"
    # 設定ツール（docs）だけの変更ではビルドしない。公開用のコミットで再ビルドが続くのも防ぐ
    paths:
      - "qmk_firmware/**"
      - "target.json"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

jobs:
  build:
    uses: sekigon-gonnoc/vial-keymap-c-editor/.github/workflows/build-keymap.yml@main

  # main のビルド結果を GitHub Pages（docs/firmware）に公開し、設定ツールから更新できるようにする
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-firmware
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: Publish to docs/firmware
        run: |
          python3 .github/scripts/publish_fw.py fw docs/firmware "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish firmware ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
